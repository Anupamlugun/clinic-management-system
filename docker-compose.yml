version: "3.9"

services:

  # Spring Boot Application
  app:
    build: .
    container_name: clinic-management-system

    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - redis

    environment:
      ACTIVE_PROFILE: dev

      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: lugun

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    restart: unless-stopped

  # PostgreSQL 17
  postgres:
    image: postgres:17
    container_name: clinic-postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lugun

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  # Redis Server
  redis:
    image: redis:8
    container_name: clinic-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: unless-stopped

volumes:
  postgres-data:
  redis-data: